name: aqualife
description: AquaLife

version: 1.2.35+35

environment:
  sdk: ">=3.1.0 <4.0.0"

publish_to: none

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  flutter_localizations:
    sdk: flutter
  flutter_mobx: ^2.3.0
  flutter_native_timezone: ^2.0.0
  flutter_svg: ^2.0.15
  hive: ^2.2.3
  intl: ^0.20.2
  mobx: ^2.5.0
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  timezone: ^0.10.1

dev_dependencies:
  build_runner: ^2.5.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  hive_generator: ^2.0.1
  mobx_codegen: ^2.7.1

flutter_icons:
  ios: true
  android: true
  image_path: assets/dev/ios_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_intl:
  main_locale: en
  enabled: true

flutter_native_splash:
  background_image: "assets/images/background.png"
